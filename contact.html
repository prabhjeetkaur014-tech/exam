<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inkJam – Contact</title>
  <link rel="icon" href="img/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/header.css" rel="stylesheet">
  <link href="css/footer.css" rel="stylesheet">
  <link href="css/contact.css" rel="stylesheet">
</head>
<body class="inner-page">

  <!-- Header is injected here by js/header.js -->
  <div id="site-header"></div>

  <section class="page-banner">
    <div class="container-xl">
      <h1>Contact</h1>
      <p><a href="home.html">Home</a> / Contact</p>
    </div>
  </section>

  <main class="container-xl py-5">
    <div id="guestNote" class="alert alert-primary py-2 small d-none">You're in guest mode, so this form is read only. <a href="index.html?notice=signup" class="alert-link">Sign up</a> to send a message.</div>
    <div id="formAlert" class="alert alert-success d-none" role="status"></div>
    <form id="contactForm" class="contact-form" novalidate>
      <div class="row g-3">
        <div class="col-md-6">
          <input type="text" class="form-control pill-input" id="cName" placeholder="Your Name" aria-label="Your name">
          <div class="invalid-feedback">Enter your name.</div>
        </div>
        <div class="col-md-6">
          <input type="tel" class="form-control pill-input" id="cPhone" placeholder="Phone Number" aria-label="Phone number">
          <div class="invalid-feedback">Enter a valid phone number.</div>
        </div>
        <div class="col-md-6">
          <input type="email" class="form-control pill-input" id="cEmail" placeholder="Your Email" aria-label="Your email">
          <div class="invalid-feedback">Enter a valid email address.</div>
        </div>
        <div class="col-md-6">
          <input type="text" class="form-control pill-input" id="cSubject" placeholder="Subject" aria-label="Subject">
          <div class="invalid-feedback">Add a subject.</div>
        </div>
        <div class="col-12">
          <textarea class="form-control pill-input" id="cMessage" rows="6" placeholder="Your Message" aria-label="Your message"></textarea>
          <div class="invalid-feedback">Write a message.</div>
        </div>
        <div class="col-12">
          <button type="submit" id="sendBtn" class="btn btn-send">Send message</button>
        </div>
      </div>
    </form>
  </main>

  <!-- Footer is injected here by js/footer.js -->
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
