<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inkJam – Contact us</title>
  <link rel="icon" href="img/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="site-header"></div>
  <section class="banner"><div class="container-xl"><h1>Contact us</h1></div></section><main class="container-xl py-5"><div id="guestNote" class="alert alert-primary py-2 small d-none">You're in guest mode, so this form is read only. <a href="index.html?notice=signup" class="alert-link">Sign up</a> to use it.</div>
    <div id="formAlert" class="alert alert-success d-none" role="status"></div>
    <form id="contactForm" novalidate><div class="row g-3">
      <div class="col-md-6"><input class="form-control pill-input" id="cName" placeholder="Your Name" aria-label="Your name"><div class="invalid-feedback">Enter a valid name.</div></div>
      <div class="col-md-6"><input type="tel" class="form-control pill-input" id="cPhone" placeholder="Phone Number" aria-label="Phone"><div class="invalid-feedback">Enter a valid phone number.</div></div>
      <div class="col-md-6"><input type="email" class="form-control pill-input" id="cEmail" placeholder="Your Email" aria-label="Email"><div class="invalid-feedback">Enter a valid email.</div></div>
      <div class="col-md-6"><input class="form-control pill-input" id="cSubject" placeholder="Subject" aria-label="Subject"><div class="invalid-feedback">Add a valid subject.</div></div>
      <div class="col-12"><textarea class="form-control pill-input" id="cMessage" rows="6" placeholder="Your Message" aria-label="Your Message"></textarea><div class="invalid-feedback">Write a message (no blocked words).</div></div>
      <div class="col-12"><button class="btn btn-ink" type="submit">Send message</button></div></div></form></main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/forms.js"></script>
</body>
</html>
