<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inkJam – Feedback</title>
  <link rel="icon" href="img/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/header.css" rel="stylesheet">
  <link href="css/footer.css" rel="stylesheet">
  <link href="css/contact.css" rel="stylesheet">
  <link href="css/feedback.css" rel="stylesheet">
</head>
<body class="inner-page">

  <!-- Header is injected here by js/header.js -->
  <div id="site-header"></div>

  <section class="page-banner">
    <div class="container-xl">
      <h1>Feedback</h1>
      <p><a href="home.html">Home</a> / Feedback</p>
    </div>
  </section>

  <main class="container-xl pt-5">
    <div id="guestNote" class="alert alert-primary py-2 small d-none">You're in guest mode, so this form is read only. <a href="index.html?notice=signup" class="alert-link">Sign up</a> to share your feedback.</div>
    <div id="formAlert" class="alert alert-success d-none" role="status"></div>
    <form id="feedbackForm" class="contact-form" novalidate>
      <div class="row g-3">
        <div class="col-md-6">
          <input type="text" class="form-control pill-input" id="fName" placeholder="Your Name" aria-label="Your name">
          <div class="invalid-feedback">Enter your name.</div>
        </div>
        <div class="col-md-6">
          <input type="email" class="form-control pill-input" id="fEmail" placeholder="Your Email" aria-label="Your email">
          <div class="invalid-feedback">Enter a valid email address.</div>
        </div>
        <div class="col-md-6">
          <select class="form-select pill-input" id="fRating" aria-label="Rating">
            <option value="" selected>Rating</option>
            <option value="5">5 – Excellent</option>
            <option value="4">4 – Good</option>
            <option value="3">3 – Okay</option>
            <option value="2">2 – Poor</option>
            <option value="1">1 – Very poor</option>
          </select>
          <div class="invalid-feedback">Choose a rating.</div>
        </div>
        <div class="col-md-6">
          <input type="text" class="form-control pill-input" id="fSubject" placeholder="Subject" aria-label="Subject">
          <div class="invalid-feedback">Add a subject.</div>
        </div>
        <div class="col-12">
          <textarea class="form-control pill-input" id="fMessage" rows="6" placeholder="Your Feedback" aria-label="Your feedback"></textarea>
          <div class="invalid-feedback">Write your feedback.</div>
        </div>
        <div class="col-12">
          <button type="submit" id="sendBtn" class="btn btn-send">Send feedback</button>
        </div>
      </div>
    </form>
  </main>

  <!-- Top reviews -->
  <section class="reviews-section">
    <div class="container-xl">
      <div class="d-flex flex-wrap justify-content-between align-items-end mb-4 gap-2">
        <h2 class="mb-0">Top reviews</h2>
        <div class="rating-summary"><span class="stars"><i class="fa-solid fa-star"></i></span> <strong id="avgRating">–</strong> average from <span id="reviewCount">0</span> reviews</div>
      </div>
      <div class="row g-4" id="reviewList"></div>
    </div>
  </section>

  <!-- Footer is injected here by js/footer.js -->
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/feedback.js"></script>
</body>
</html>
