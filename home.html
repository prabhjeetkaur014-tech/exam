<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inkJam – Home</title>
  <link rel="icon" href="img/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/header.css" rel="stylesheet">
  <link href="css/footer.css" rel="stylesheet">
  <link href="css/home.css" rel="stylesheet">
</head>
<body class="home-page">

  <!-- Header is injected here by js/header.js -->
  <div id="site-header"></div>

  <div class="container-xl py-4">
    <div id="guestBanner" class="alert alert-primary py-2 small d-none">You're in guest mode: read only. <a href="index.html?notice=signup" class="alert-link">Sign up</a> to write and save favourites.</div>
    <div class="row g-4">
      <!-- Vertical category pane -->
      <aside class="col-md-3 col-lg-2">
        <h6 class="side-title">Categories</h6>
        <div class="cat-list" id="catList">
          <button class="cat-btn active" data-cat="Default"><i class="fa-solid fa-layer-group"></i>Default</button>
          <button class="cat-btn" data-cat="Food"><i class="fa-solid fa-utensils"></i>Food</button>
          <button class="cat-btn" data-cat="Books"><i class="fa-solid fa-book"></i>Books</button>
          <button class="cat-btn" data-cat="Music"><i class="fa-solid fa-music"></i>Music</button>
          <button class="cat-btn" data-cat="Travel"><i class="fa-solid fa-plane"></i>Travel</button>
          <button class="cat-btn" data-cat="Other"><i class="fa-solid fa-ellipsis"></i>Other</button>
        </div>
      </aside>
      <!-- Posts -->
      <section class="col-md-9 col-lg-10">
        <h2 id="feedTitle" class="mb-4">Latest on inkJam</h2>
        <div id="postList"></div>
      </section>
    </div>
  </div>

  <!-- Sticky create post button -->
  <button id="createPostBtn" class="create-fab" type="button"><i class="fa-solid fa-pen me-2"></i>Create post</button>

  <!-- Footer is injected here by js/footer.js -->
  <div id="site-footer"></div>

  <!-- Create post modal (signed-in users only) -->
  <div class="modal fade" id="postModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="postForm" novalidate>
        <div class="modal-header"><h5 class="modal-title">Create post</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label" for="pTitle">Title</label><input class="form-control" id="pTitle" required><div class="invalid-feedback">Add a title.</div></div>
          <div class="mb-3"><label class="form-label" for="pCat">Category</label>
            <select class="form-select" id="pCat"><option>Food</option><option>Books</option><option>Music</option><option>Travel</option><option>Other</option></select></div>
          <div class="mb-3"><label class="form-label" for="pBody">Your story</label><textarea class="form-control" id="pBody" rows="5" required></textarea><div class="invalid-feedback">Write something first.</div></div>
        </div>
        <div class="modal-footer"><button type="submit" class="btn btn-primary-ink">Publish</button></div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
